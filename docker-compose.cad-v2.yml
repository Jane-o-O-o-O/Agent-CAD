# Standalone exact-CAD workbench. The existing full-stack Compose remains separate.
services:
  cad-v2:
    build:
      context: ./backend
      dockerfile: Dockerfile.cad-v2
    environment:
      CAD_V2_LOCAL_TOKEN: ${CAD_V2_LOCAL_TOKEN:?Set a private local login token of at least 16 characters}
      CAD_V2_DATA_DIR: /var/lib/agent-cad
      CAD_V2_API_BASE: ${CAD_V2_API_BASE:-https://api.openai.com/v1}
      CAD_V2_API_KEY: ${CAD_V2_API_KEY:-}
      CAD_V2_MODEL: ${CAD_V2_MODEL:-gpt-6.1-sol}
      CAD_V2_MAX_CONCURRENCY: "2"
      CAD_V2_MAX_REPAIRS: "3"
      # Fails closed if the host kernel/container policy lacks Landlock ABI 3.
      CAD_V2_ISOLATION: strict
    volumes:
      - cad_v2_data:/var/lib/agent-cad
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 6g
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://cad-v2:8000
    ports:
      - "127.0.0.1:${CAD_V2_PORT:-5173}:80"
    depends_on:
      cad-v2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/v1/auth/status]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  cad_v2_data:
