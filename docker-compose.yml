services:
  frontend:
    image: ${IMAGE_REGISTRY:-agent-cad}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - agent-cad-network
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    image: ${IMAGE_REGISTRY:-agent-cad}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    depends_on:
      - sandbox
      - claw
      - mongodb
      - redis
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cad_v2_data:/var/lib/agent-cad
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
    networks:
      - agent-cad-network
    env_file:
      - .env
    environment:
      - CAD_V2_DATA_DIR=/var/lib/agent-cad

  sandbox:
    image: ${IMAGE_REGISTRY:-agent-cad}/sandbox:${IMAGE_TAG:-latest}
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    command: /bin/sh -c "exit 0"  # prevent sandbox from starting, ensure image is pulled
    restart: "no"
    networks:
      - agent-cad-network

  claw:
    image: ${IMAGE_REGISTRY:-agent-cad}/claw:${IMAGE_TAG:-latest}
    build:
      context: ./claw
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    entrypoint: /bin/sh -c "exit 0"  # prevent claw from starting, ensure image is pulled
    restart: "no"
    networks:
      - agent-cad-network

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    #ports:
    #  - "27017:27017"
    networks:
      - agent-cad-network

  redis:
    image: redis:7.0
    restart: unless-stopped
    networks:
      - agent-cad-network

volumes:
  cad_v2_data:
  mongodb_data:
    name: agent-cad-mongodb-data

networks:
  agent-cad-network:
    name: agent-cad-network
    driver: bridge
