[project]
name = "backend"
version = "0.1.0"
description = "Backend for AI Manus × Claw — general-purpose AI Agent system with integrated OpenClaw assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentscope==2.0.0",
    "async-lru>=2.0.0",
    "beanie>=1.25.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.14.0",
    "cryptography>=3.4.8",
    "debugpy>=1.8.17",
    "docling>=2.96.0",
    "docker>=7.1.0",
    "ezdxf>=1.4.3",
    "fastapi>=0.121.2",
    "httpx>=0.28.1",
    "markdownify>=1.2.0",
    "mcp>=1.9.0",
    "openai>=2.8.0",
    "openpyxl>=3.1.5",
    "browser-use>=0.12.1",
    "pillow>=10.0.0",
    "playwright>=1.42.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pypdf>=5.0.0",
    "pyjwt[crypto]>=2.8.0",
    "pymongo>=4.14.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "redis>=5.0.1",
    "rich>=14.2.0",
    "tavily-python>=0.5.0",
    "sse-starlette>=3.0.3",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "requests>=2.28.0",
]
