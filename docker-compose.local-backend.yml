services:
  backend:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/uv.lock:/app/uv.lock
      - ./backend/app:/app/app
    command:
      [
        "sh",
        "-lc",
        "uv sync --frozen --no-dev && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]
